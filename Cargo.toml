[package]
name = "charging_sim_2"
version = "0.1.0"
description = "An event-driven simulation of electric vehicle (EV) charging."
authors = ["Jez Smith <j.smith.03@cantab.net>"]
readme = "README.md"
license-file = "LICENSE.md"
include = ["src/", "LICENSE.md", "README.md"]
edition = "2024"

[dependencies]
chrono = "0.4"
csv = "1.4"
env_logger = "0.11"
log = "0.4"
rand = "0.10"
rand_distr = "0.6"
rustc-hash = "2.1"
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"
uuid = { version = "1.23", features = ["v4", "fast-rng", "macro-diagnostics", "serde"] }

[dev-dependencies]
assert_approx_eq = "1.1.0"
